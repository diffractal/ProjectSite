<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moiré pattern maker</title>
<style>
:root{
  --ink:#16191d; --panel:#f5f6f7; --table:#cdd2d8; --rule:#d8dce1; --field:#fff;
  --accent:#1d4f9f; --accent-ink:#fff; --warn:#a4400f;
}
@media (prefers-color-scheme:dark){
  :root{--ink:#e8eaed; --panel:#1b1e22; --table:#2b3036; --rule:#363b42; --field:#23272c;
        --accent:#7fb0ff; --accent-ink:#0d1b33; --warn:#f0a070;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--panel);color:var(--ink);
  font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{display:grid;grid-template-columns:22rem 1fr;min-height:100vh}
aside{padding:1.5rem;display:flex;flex-direction:column;gap:1.1rem;
  position:sticky;top:0;max-height:100vh;overflow:auto;border-right:1px solid var(--rule)}
h1{margin:0;font:600 1.6rem/1.1 "Iowan Old Style",Palatino,"Palatino Linotype",Georgia,serif;letter-spacing:-.01em}
.lede{margin:.3rem 0 0;color:color-mix(in srgb,var(--ink) 65%,transparent);font-size:.9rem}
label,.lab{display:block;font-weight:600;font-size:.85rem;margin-bottom:.3rem}
.hint{font-weight:400;color:color-mix(in srgb,var(--ink) 62%,transparent);font-size:.8rem;margin-top:.25rem}
input[type=number],select{width:100%;padding:.5rem .6rem;border:1px solid var(--rule);border-radius:6px;
  background:var(--field);color:inherit;font:inherit;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent);margin:.2rem 0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.seg label{margin:0;font-weight:500}
.seg input{position:absolute;opacity:0}
.seg span{display:block;padding:.35rem .9rem;cursor:pointer}
.seg input:checked+span{background:var(--accent);color:var(--accent-ink)}
.seg input:focus-visible+span,input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.check{display:flex;gap:.5rem;align-items:center;font-weight:500;margin:0}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
button{padding:.65rem .8rem;border-radius:6px;border:1px solid var(--accent);font:600 .95rem inherit;font-family:inherit;
  cursor:pointer;background:var(--accent);color:var(--accent-ink)}
button.alt{background:transparent;color:var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
main{background:var(--table);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.9rem;padding:2rem}
.sheet{background:#fff;line-height:0;box-shadow:0 1px 2px rgba(0,0,0,.25),0 14px 34px -10px rgba(0,0,0,.45)}
canvas{display:block;max-width:100%;max-height:calc(100vh - 8rem)}
#info{margin:0;text-align:center;font-size:.85rem;font-variant-numeric:tabular-nums;max-width:40rem}
#warn{margin:0;color:var(--warn);font-size:.85rem;text-align:center;max-width:40rem;min-height:1.2em}
footer{margin-top:auto;padding-top:.5rem;font-size:.8rem;color:color-mix(in srgb,var(--ink) 55%,transparent);font-variant-numeric:tabular-nums}
@media (max-width:820px){
  .app{grid-template-columns:1fr} aside{position:static;max-height:none;border:0}
  main{padding:1rem 1rem 2rem} canvas{max-height:none}
}
</style>
</head>
<body>
<div class="app">
<aside>
  <div>
    <h1>Moiré pattern maker</h1>
    <p class="lede">Black-on-white patterns sized for printing.</p>
  </div>

  <div>
    <label for="pattern">Pattern</label>
    <select id="pattern"></select>
  </div>

  <div>
    <span class="lab">Units</span>
    <div class="seg">
      <label><input type="radio" name="unit" value="in" checked><span>inches</span></label>
      <label><input type="radio" name="unit" value="mm"><span>mm</span></label>
    </div>
  </div>

  <div class="row">
    <div><label for="w">Width (<span class="u">in</span>)</label><input id="w" type="number" step="any" min="0" value="8.5"></div>
    <div><label for="h">Height (<span class="u">in</span>)</label><input id="h" type="number" step="any" min="0" value="11"></div>
  </div>

  <div>
    <label for="dpi">Resolution (pixels per inch)</label>
    <input id="dpi" type="number" step="50" min="10" value="600">
  </div>

  <div>
    <label for="pitch">Grid spacing (<span class="u">in</span>)</label>
    <input id="pitch" type="number" step="any" min="0" value="0.1">
    <div class="hint" id="pitchHint"></div>
  </div>

  <div>
    <label for="duty">Line thickness: <span id="dutyOut"></span></label>
    <input id="duty" type="range" min="1" max="90" step="0.5" value="50">
    <label class="check"><input id="auto" type="checkbox" checked> Auto: about 50% of the area black</label>
  </div>

  <div>
    <label for="border">Blank border (<span class="u">in</span>)</label>
    <input id="border" type="number" step="any" min="0" value="0.5">
    <div class="hint">Margin around the pattern with no lines.</div>
  </div>

  <label class="check"><input id="invert" type="checkbox"> Invert (white lines on black)</label>

  <div class="btns">
    <button id="png">Download PNG</button>
    <button id="svg" class="alt">Download SVG</button>
  </div>

  <footer>Moiré pattern maker <span id="ver"></span></footer>
</aside>

<main>
  <div class="sheet"><canvas id="cv" width="10" height="10"></canvas></div>
  <p id="info"></p>
  <p id="warn"></p>
</main>
</div>

<script>
/* Changelog
   v0.3  Much finer spacing allowed (limits are now per pattern, not a fixed tile count); hex/Penrose
         draw each edge once; preview updates are debounced.
   v0.2  Penrose tiling pattern; version label.
   v0.1  Lines, square, isometric and hex patterns; PNG/SVG export. */
const VERSION = 'v0.3';
const $ = id => document.getElementById(id);
const f = n => Math.round(n * 1e5) / 1e5;
const INCH = { in: 1, mm: 1 / 25.4 };
let unit = 'in', last = null;
$('ver').textContent = VERSION;

/* ---------- Pattern registry ----------
   To add a pattern (e.g. Penrose): add an entry with
   gen(rect, spacing) -> SVG path string in inches, rect = [x0,y0,x1,y1],
   and ink = line-width / spacing that gives ~50% black coverage. */
const LINE_HINT = 'Distance between neighboring parallel lines.';
const lines = angles => (r, d) => {
  const [x0, y0, x1, y1] = r, ox = x0 + d / 2, oy = y0 + d / 2;
  const L = Math.hypot(x1 - x0, y1 - y0) + d;
  let s = '';
  for (const a of angles) {
    const t = a * Math.PI / 180, ux = Math.cos(t), uy = Math.sin(t), nx = -uy, ny = ux;
    const pr = [x0 * nx + y0 * ny, x1 * nx + y0 * ny, x0 * nx + y1 * ny, x1 * nx + y1 * ny];
    const o = ox * nx + oy * ny;
    const k0 = Math.floor((Math.min(...pr) - o) / d) - 1, k1 = Math.ceil((Math.max(...pr) - o) / d) + 1;
    for (let k = k0; k <= k1; k++) {
      const cx = ox + nx * k * d, cy = oy + ny * k * d;
      s += `M${f(cx - ux * L)} ${f(cy - uy * L)}L${f(cx + ux * L)} ${f(cy + uy * L)}`;
    }
  }
  return s;
};
const hexes = (r, d) => {               // pointy-top hexagons, d = flat-to-flat
  const [x0, y0, x1, y1] = r, R = d / Math.sqrt(3), rowH = 1.5 * R;
  const rows = Math.ceil((y1 - y0) / rowH) + 2, cols = Math.ceil((x1 - x0) / d) + 2;
  const out = [], vx = [], vy = [];      // each hexagon draws only its E, NE and SE edges, so no edge is drawn twice
  for (let j = -1; j <= rows; j++) {
    const cy = y0 + R + j * rowH, sh = (Math.abs(j) % 2) * d / 2;
    for (let i = -1; i <= cols; i++) {
      const cx = x0 + d / 2 + sh + i * d;
      for (let k = 0; k < 6; k++) { const a = (30 + 60 * k) * Math.PI / 180; vx[k] = cx + R * Math.cos(a); vy[k] = cy + R * Math.sin(a); }
      out.push(vx[0], vy[0], vx[1], vy[1], vx[4], vy[4], vx[5], vy[5], vx[5], vy[5], vx[0], vy[0]);
    }
  }
  return out;                            // flat [x1,y1,x2,y2, ...]
};
const penrose = (r, d) => {              // P3 rhombs via Robinson-triangle subdivision; d = rhomb edge length
  const [x0, y0, x1, y1] = r, cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, PHI = (1 + Math.sqrt(5)) / 2;
  const need = Math.hypot(x1 - x0, y1 - y0) / 2 + 2 * d;
  let R = d, n = 0;
  while (R * Math.cos(Math.PI / 10) < need) { R *= PHI; n++; }
  let T = [];                            // flat list, 7 numbers per triangle: color, Ax,Ay, Bx,By, Cx,Cy (A is the apex)
  for (let i = 0; i < 10; i++) {
    let a = (2 * i - 1) * Math.PI / 10, b = (2 * i + 1) * Math.PI / 10;
    if (i % 2 === 0) [a, b] = [b, a];
    T.push(0, cx, cy, cx + R * Math.cos(a), cy + R * Math.sin(a), cx + R * Math.cos(b), cy + R * Math.sin(b));
  }
  const add = (U, c, ax, ay, bx, by, qx, qy) => {   // keep only triangles that can touch the sheet
    if (Math.max(ax, bx, qx) >= x0 - d && Math.min(ax, bx, qx) <= x1 + d &&
        Math.max(ay, by, qy) >= y0 - d && Math.min(ay, by, qy) <= y1 + d) U.push(c, ax, ay, bx, by, qx, qy);
  };
  for (let k = 0; k < n; k++) {
    const U = [];
    for (let i = 0; i < T.length; i += 7) {
      const c = T[i], ax = T[i + 1], ay = T[i + 2], bx = T[i + 3], by = T[i + 4], qx = T[i + 5], qy = T[i + 6];
      if (c === 0) {
        const px = ax + (bx - ax) / PHI, py = ay + (by - ay) / PHI;
        add(U, 0, qx, qy, px, py, bx, by); add(U, 1, px, py, qx, qy, ax, ay);
      } else {
        const Qx = bx + (ax - bx) / PHI, Qy = by + (ay - by) / PHI;
        const Rx = bx + (qx - bx) / PHI, Ry = by + (qy - by) / PHI;
        add(U, 1, Rx, Ry, qx, qy, ax, ay); add(U, 1, Qx, Qy, Rx, Ry, bx, by); add(U, 0, Rx, Ry, Qx, Qy, ax, ay);
      }
    }
    T = U;
  }
  const seen = new Set(), out = [];      // each edge is a leg of two triangles; keep it once (keyed by its midpoint)
  const seg = (x, y, u, v) => {
    const key = Math.round((x + u) * 5e3) * 67108864 + Math.round((y + v) * 5e3);
    if (!seen.has(key)) { seen.add(key); out.push(x, y, u, v); }
  };
  for (let i = 0; i < T.length; i += 7) { seg(T[i+1], T[i+2], T[i+3], T[i+4]); seg(T[i+1], T[i+2], T[i+5], T[i+6]); }
  return out;                            // flat [x1,y1,x2,y2, ...]
};
const SQ = 1 - Math.SQRT1_2;            // line/spacing giving 50% black for square & hex cells
const PATTERNS = {
  v:   { label: 'Vertical lines',   ink: 0.5,        hint: LINE_HINT, gen: lines([90]) },
  h:   { label: 'Horizontal lines', ink: 0.5,        hint: LINE_HINT, gen: lines([0]) },
  sq:  { label: 'Square grid',      ink: SQ,         hint: LINE_HINT, gen: lines([0, 90]) },
  iso: { label: 'Isometric grid',   ink: SQ * 2 / 3, hint: LINE_HINT + ' Lines run at 0°, 60° and 120°.', gen: lines([0, 60, 120]) },
  hex: { label: 'Hex grid',         ink: SQ,         hint: 'Distance between opposite flat sides of each hexagon.', gen: hexes, max: 1e6 },
  pen: { label: 'Penrose tiling',   ink: 0.24,       hint: 'Edge length of every rhombus (thin and thick). Auto thickness is approximate.', gen: penrose, max: 1.5e6 }
};
for (const [k, p] of Object.entries(PATTERNS)) $('pattern').add(new Option(p.label, k));

/* ---------- Model ---------- */
const num = id => parseFloat($(id).value);

function model() {
  const u = INCH[unit], pat = PATTERNS[$('pattern').value];
  const W = num('w') * u, H = num('h') * u, d = num('pitch') * u, b = (num('border') || 0) * u, dpi = num('dpi');
  if (![W, H, d, dpi].every(v => v > 0) || !(b >= 0)) return { err: 'Enter positive values for size, resolution and spacing.' };
  const rect = [b, b, W - b, H - b];
  if (rect[2] <= rect[0] || rect[3] <= rect[1]) return { err: 'The border is larger than the sheet.' };
  const area = (rect[2] - rect[0]) * (rect[3] - rect[1]), cap = pat.max || 1e8;
  if (area / (d * d) > cap) return { err: `Spacing is too small for this pattern on this sheet (the smallest allowed here is about ${+(Math.sqrt(area / cap) / INCH[unit]).toPrecision(2)} ${unit}).` };
  const lw = d * $('duty').value / 100;
  return { W, H, d, b, dpi, rect, lw, pat, u,
           pxW: Math.round(W * dpi), pxH: Math.round(H * dpi),
           fg: $('invert').checked ? '#fff' : '#000', bg: $('invert').checked ? '#000' : '#fff',
           path: pat.gen(rect, d) };
}

const toPath2D = p => {                 // patterns return an SVG path string or a flat [x1,y1,x2,y2,...] list
  if (typeof p === 'string') return new Path2D(p);
  const q = new Path2D();
  for (let i = 0; i < p.length; i += 4) { q.moveTo(p[i], p[i + 1]); q.lineTo(p[i + 2], p[i + 3]); }
  return q;
};
const toSvgD = p => {
  if (typeof p === 'string') return p;
  const parts = [];
  for (let i = 0; i < p.length; i += 4) parts.push(`M${f(p[i])} ${f(p[i + 1])}L${f(p[i + 2])} ${f(p[i + 3])}`);
  return parts.join('');
};

function paint(ctx, s, m) {
  const c = ctx.canvas;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = m.bg; ctx.fillRect(0, 0, c.width, c.height);
  ctx.save(); ctx.scale(s, s);
  const [x0, y0, x1, y1] = m.rect;
  ctx.beginPath(); ctx.rect(x0, y0, x1 - x0, y1 - y0); ctx.clip();
  ctx.lineWidth = m.lw; ctx.strokeStyle = m.fg; ctx.lineJoin = 'miter'; ctx.lineCap = 'round';
  ctx.stroke(toPath2D(m.path));
  ctx.restore();
}

let timer;
const schedule = () => { clearTimeout(timer); $('info').textContent = 'Rendering…'; timer = setTimeout(render, 60); };

function render() {
  const m = model(), info = $('info'), warn = $('warn');
  $('pitchHint').textContent = PATTERNS[$('pattern').value].hint;
  const t = $('duty').value / 100;
  $('dutyOut').textContent = `${(+$('duty').value).toFixed(1)}% of spacing`;
  if (m.err) { last = null; info.textContent = ''; warn.textContent = m.err; $('png').disabled = $('svg').disabled = true; return; }
  last = m;
  const tu = m.lw / INCH[unit], warns = [];
  $('dutyOut').textContent = `${(t * 100).toFixed(1)}% of spacing (${+tu.toFixed(3)} ${unit})`;
  const mp = m.pxW * m.pxH / 1e6, tooBig = mp > 150 || Math.max(m.pxW, m.pxH) > 32000;
  if (tooBig) warns.push('This image is too large for a browser canvas. Lower the resolution or the size.');
  if (m.lw * m.dpi < 2) warns.push('Lines are under 2 px wide at this resolution. Raise the resolution or the thickness.');
  if (m.d * m.dpi < 6) warns.push('Spacing is only a few pixels. Raise the resolution.');
  if (Array.isArray(m.path) && m.path.length / 4 > 5e5) warns.push('The SVG will be very large here; PNG is the better choice.');
  $('png').disabled = tooBig; $('svg').disabled = false;
  const sz = x => +(x / INCH[unit]).toFixed(unit === 'in' ? 3 : 1);
  info.textContent = `${sz(m.W)} × ${sz(m.H)} ${unit} · ${m.pxW} × ${m.pxH} px (${mp.toFixed(1)} MP) · line ${+(m.lw * m.dpi).toFixed(1)} px. Preview is downsampled; the download is full resolution.`;
  warn.textContent = warns.join(' ');
  const cv = $('cv'), s = 1100 / Math.max(m.W, m.H);
  cv.width = Math.round(m.W * s); cv.height = Math.round(m.H * s);
  paint(cv.getContext('2d'), cv.width / m.W, m);
}

/* ---------- Controls ---------- */
function applyAuto() { if ($('auto').checked) $('duty').value = (PATTERNS[$('pattern').value].ink * 100).toFixed(1); }
$('auto').onchange = () => { applyAuto(); schedule(); };
$('duty').oninput = () => { $('auto').checked = false; schedule(); };
$('pattern').onchange = () => { applyAuto(); schedule(); };
document.querySelectorAll('input[name=unit]').forEach(r => r.onchange = () => {
  const k = INCH[unit] / INCH[r.value], dp = r.value === 'in' ? 3 : 2;
  for (const id of ['w', 'h', 'pitch', 'border']) { const v = num(id); if (isFinite(v)) $(id).value = +(v * k).toFixed(dp); }
  unit = r.value;
  document.querySelectorAll('.u').forEach(e => e.textContent = unit);
  schedule();
});
['w', 'h', 'dpi', 'pitch', 'border', 'invert'].forEach(id => $(id).addEventListener('input', schedule));

/* ---------- Export ---------- */
function save(blob, ext) {
  const m = last, n = id => $(id).value;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `moire-${$('pattern').value}-${n('w')}x${n('h')}${unit}-${n('pitch')}${unit}-${m.dpi}dpi.${ext}`;
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
const T = new Uint32Array(256).map((_, n) => { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; return c >>> 0; });
const crc = b => { let c = -1; for (const x of b) c = T[(c ^ x) & 255] ^ (c >>> 8); return (~c) >>> 0; };
async function addDpi(blob, dpi) {      // embed pixels-per-meter so print dialogs know the true size
  const b = new Uint8Array(await blob.arrayBuffer());
  if (String.fromCharCode(...b.subarray(37, 41)) === 'pHYs') return blob;
  const ppm = Math.round(dpi / 0.0254), c = new Uint8Array(21), v = new DataView(c.buffer);
  v.setUint32(0, 9); c.set([0x70, 0x48, 0x59, 0x73], 4); v.setUint32(8, ppm); v.setUint32(12, ppm); c[16] = 1;
  v.setUint32(17, crc(c.subarray(4, 17)));
  return new Blob([b.subarray(0, 33), c, b.subarray(33)], { type: 'image/png' });
}
$('png').onclick = () => {
  if (!last) return;
  const m = last, btn = $('png'); btn.disabled = true; btn.textContent = 'Rendering…';
  setTimeout(() => {
    const cv = document.createElement('canvas'); cv.width = m.pxW; cv.height = m.pxH;
    paint(cv.getContext('2d'), m.pxW / m.W, m);
    cv.toBlob(async b => {
      if (b) save(await addDpi(b, m.dpi), 'png'); else $('warn').textContent = 'The browser could not create an image this large.';
      btn.textContent = 'Download PNG'; btn.disabled = false;
    }, 'image/png');
  }, 30);
};
$('svg').onclick = () => {
  if (!last) return;
  const m = last, [x0, y0, x1, y1] = m.rect;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${f(m.W)}in" height="${f(m.H)}in" viewBox="0 0 ${f(m.W)} ${f(m.H)}">` +
    `<defs><clipPath id="c"><rect x="${f(x0)}" y="${f(y0)}" width="${f(x1 - x0)}" height="${f(y1 - y0)}"/></clipPath></defs>` +
    `<rect width="${f(m.W)}" height="${f(m.H)}" fill="${m.bg}"/>` +
    `<g clip-path="url(#c)"><path d="${toSvgD(m.path)}" fill="none" stroke="${m.fg}" stroke-width="${f(m.lw)}" stroke-linejoin="miter" stroke-linecap="round"/></g></svg>`;
  save(new Blob([svg], { type: 'image/svg+xml' }), 'svg');
};

applyAuto(); render();
</script>
</body>
</html>
